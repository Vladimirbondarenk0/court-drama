<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Судебный диалог и проект доставки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background: linear-gradient(145deg, #f4f6f9 0%, #eceff4 100%), url("https://assets.hope.study/images/3p-IH9S5p.png") no-repeat center center fixed;
            background-size: cover;
            background-attachment: fixed;
            color: #2d3748;
            scroll-behavior: smooth;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(244, 246, 249, 0.92);
            z-index: -1;
            pointer-events: none;
        }

        header {
            max-width: 750px;
            margin: 40px auto 10px;
            padding: 0 20px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .chat-container {
            max-width: 750px;
            margin: 0 auto;
            padding: 20px 20px 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Плавное появление при скролле */
        .message-row {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            width: 100%;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .message-row.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .bubble {
            flex-grow: 1;
            padding: 18px 22px;
            border-radius: 16px;
            position: relative;
        }

        /* Стили облачков для всех персонажей */
        .prosecutor .bubble {
            background-color: rgb(242, 243, 255);
            box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 4px 0px, rgb(216, 218, 243) 0px 6px 20px 0px;
        }

        .defender .bubble {
            background-color: rgb(255, 241, 227);
            box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 4px 0px, rgba(219, 145, 32, 0.3) 0px 6px 20px 0px;
        }

        .huong .bubble {
            background-color: rgb(234, 254, 240);
            box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 4px 0px, rgba(100, 227, 134, 0.3) 0px 6px 20px 0px;
        }

        .sojun .bubble {
            background-color: rgb(242, 255, 255);
            box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 4px 0px, rgba(119, 206, 231, 0.3) 0px 6px 20px 0px;
        }

        .oleg .bubble {
            background-color: rgb(255, 253, 234);
            box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 4px 0px, rgba(231, 172, 83, 0.3) 0px 6px 20px 0px;
        }

        .text {
            font-size: 15px;
            line-height: 1.6;
            color: #1f1f1f;
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
        }

        .role {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
            color: #718096;
        }

        .time {
            color: #718096;
            font-weight: 400;
        }

        .message-attachment {
            margin-top: 12px;
            border-radius: 12px;
            overflow: hidden;
            max-width: 100%;
        }

        .message-attachment img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        .interactive-poll {
            margin-top: 12px;
            background: #fff;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .poll-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .poll-option {
            padding: 10px 12px;
            background: #f7fafc;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .poll-option:hover {
            background: #edf2f7;
        }

        .poll-option.selected {
            background: #ebf8ff;
            border-color: #3182ce;
            color: #2b6cb0;
            font-weight: 600;
        }

        .poll-option.correct {
            background: #f0fff4;
            border-color: #38a169;
            color: #22543d;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Заседание и Проект доставки Библии</h1>
    </header>

    <div class="chat-container" id="chat"></div>
