<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Голос Истины: Судебный Диалог</title>
  <link rel="icon" href="https://api.iconify.design/lucide:scale.svg?color=%23b89968" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM (Production Build) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for JSX in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons & Framer Motion -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <style>
    /* ============================================================
       ГОЛОС ИСТИНЫ · Пользовательские стили
       ============================================================ */
    :root {
      --background: 0 0% 100%;
      --foreground: 0 0% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 0 0% 3.9%;
      --border: 0 0% 89.8%;
      --font-body: 'Montserrat', sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #fbf9f5;
      transition: background-color 0.5s ease;
      font-family: var(--font-body);
    }
    body.dark-base { background-color: #161311; }
    body.stage-locked { overflow: hidden; }

    .dlg-root {
      --ivory: #fbf9f5;
      --beige: #f2efe9;
      --ink: #3e3129;
      --ink-soft: #5b4f47;
      --terracotta: #b5654a;
      --terracotta-soft: #d8a98f;
      --olive: #7c7340;
      --gold: #b89968;
      --slate: #6f7a82;
      --line: #e3ddd2;
      background: var(--ivory);
      color: var(--ink);
      font-family: "Montserrat", sans-serif;
      font-weight: 300;
      line-height: 1.8;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      width: 100%;
      position: relative;
      transition: background 0.5s ease, color 0.5s ease;
    }

    .dlg-root.dark-mode {
      --ivory: #161311;
      --beige: #211c18;
      --ink: #ece5dc;
      --ink-soft: #b5aaa0;
      --terracotta: #ad7e6d;
      --terracotta-soft: #8a5342;
      --olive: #a39755;
      --gold: #d4b483;
      --slate: #9aa5ae;
      --line: #332b25;
      background: var(--ivory);
    }

    .dlg-root * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ---------- Сцена ---------- */
    .dlg-root .stage {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      opacity: 0; pointer-events: none; transition: opacity 1.8s ease;
    }
    .dlg-root .stage.is-on { opacity: 1; }
    .dlg-root .stage-frame {
      position: absolute; transform-origin: 50% 50%;
      transition: transform 1.45s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .dlg-root .stage-img {
      width: 100%; height: 100%; display: block; object-fit: cover;
      transition: filter 1.5s ease;
    }
    .dlg-root .stage.is-finale .stage-img {
      filter: brightness(0.4) saturate(0.88) contrast(1.05);
    }
    .dlg-root .stage-scrim {
      position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(120% 90% at 50% 18%, rgba(22, 19, 17, 0.12) 0%, rgba(22, 19, 17, 0.68) 62%, rgba(16, 13, 11, 0.94) 100%);
      transition: opacity 1.6s ease;
    }
    .dlg-root .stage.is-finale .stage-scrim { opacity: 1; }

    /* ---------- Пролог ---------- */
    .dlg-root .court-hero {
      position: fixed; inset: 0; z-index: 20; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 0.4rem; padding: 6rem 1.5rem;
      background: radial-gradient(1200px 800px at 80% -10%, #fffdf8 0%, transparent 60%),
                  radial-gradient(900px 700px at -10% 110%, #efe9df 0%, transparent 55%), var(--ivory);
      transition: opacity 1.5s ease;
    }
    .dlg-root.dark-mode .court-hero {
      background: radial-gradient(1200px 800px at 80% -10%, #201a16 0%, transparent 60%),
                  radial-gradient(900px 700px at -10% 110%, #110e0c 0%, transparent 55%), var(--ivory);
    }
    .dlg-root .court-hero.is-hidden { opacity: 0; pointer-events: none; }

    .dlg-root .eyebrow {
      letter-spacing: 0.5em; text-transform: uppercase; font-size: 0.72rem;
      font-weight: 500; color: var(--terracotta); margin-bottom: 2.2rem;
      opacity: 0; animation: dlgFadeUp 1.1s 0.1s ease forwards;
    }
    .dlg-root h1 {
      font-family: "Playfair Display", serif; font-weight: 600;
      font-size: clamp(2.2rem, 5.5vw, 4.6rem); line-height: 1.15;
      letter-spacing: -0.01em; max-width: 22ch; text-align: center;
      opacity: 0; animation: dlgFadeUp 1.3s 0.35s ease forwards;
    }
    .dlg-root h1 em { font-style: italic; color: var(--olive); font-weight: 400; }
    .dlg-root .sub {
      margin-top: 2rem; max-width: 44ch; color: var(--ink-soft); font-size: 1rem;
      opacity: 0; animation: dlgFadeUp 1.3s 0.7s ease forwards;
    }

    @keyframes dlgFadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dlg-root .entry-btn {
      display: inline-flex; align-items: center; gap: 0.85rem; padding: 1.05rem 2.5rem;
      border-radius: 999px; font-family: "Montserrat", sans-serif; font-size: 0.78rem;
      font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; cursor: pointer;
      border: 1px solid var(--terracotta); background: transparent; color: var(--terracotta);
      opacity: 0; animation: dlgFadeUp 1.3s 1.05s ease forwards;
      transition: all 0.45s ease;
    }
    .dlg-root .entry-btn:hover {
      background: var(--terracotta); color: var(--ivory); transform: translateY(-3px);
      box-shadow: 0 22px 45px -22px rgba(181, 101, 74, 0.75);
    }

    /* ---------- Подписи персонажей ---------- */
    .dlg-root .captions { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
    .dlg-root .cap-slot { position: absolute; display: flex; align-items: center; }
    .dlg-root .slot-right { right: 4.5vw; top: 0; bottom: 0; }
    .dlg-root .slot-left { left: 4.5vw; top: 0; bottom: 0; }
    .dlg-root .slot-center { left: 4vw; right: 4vw; bottom: 3.2vh; justify-content: center; flex-direction: column; align-items: center; gap: 1.15rem; }
    .dlg-root .cast-caption {
      width: min(28rem, 36vw); padding: 2.1rem 2.2rem 2.2rem; border-radius: 3px;
      border: 1px solid rgba(227, 221, 210, 0.9); background: rgba(251, 249, 245, 0.9);
      backdrop-filter: blur(20px) saturate(1.1); box-shadow: 0 50px 90px -60px rgba(30, 20, 14, 0.9);
      opacity: 0; transform: translateY(28px); transition: opacity 1s ease, transform 1.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dlg-root .cast-caption.is-in { opacity: 1; transform: translateY(0); }
    .dlg-root.dark-mode .cast-caption { background: rgba(27, 23, 20, 0.9); border-color: rgba(69, 69, 69, 0.85); }
    .dlg-root .cap-kicker { font-size: 0.64rem; letter-spacing: 0.42em; text-transform: uppercase; color: var(--terracotta); margin-bottom: 0.9rem; }
    .dlg-root .cap-name { font-family: "Playfair Display", serif; font-weight: 600; font-size: clamp(1.4rem, 2.1vw, 1.95rem); color: var(--ink); }
    .dlg-root .cap-role { margin-top: 0.65rem; font-size: 0.68rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink-soft); }
    .dlg-root .cap-desc { margin-top: 1.4rem; font-size: 0.9rem; line-height: 1.75; color: var(--ink-soft); }

    .dlg-root .slot-center .cast-caption {
      width: min(60rem, 92vw); padding: 1.7rem 2.1rem; border-radius: 10px;
      display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 2rem; align-items: center;
    }

    /* ---------- Кнопка темы ---------- */
    .dlg-root .theme-toggle {
      position: fixed; top: 1.5rem; right: 1.5rem; z-index: 100;
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; border: 1px solid var(--line); background: var(--beige); color: var(--ink);
      cursor: pointer; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); transition: all 0.3s ease;
    }
    .dlg-root .theme-toggle:hover { transform: scale(1.08); border-color: var(--terracotta); }

    /* ---------- Диалог ---------- */
    .dlg-root .court { max-width: 880px; margin: 0 auto; padding: 8rem 1.5rem; position: relative; z-index: 2; }
    .dlg-root .line { position: relative; z-index: 2; display: flex; align-items: flex-start; gap: 1rem; margin: 2.4rem 0; opacity: 1; transform: translateY(0); }
    .dlg-root .line .card {
      position: relative; flex-grow: 1; max-width: 78%; padding: 1.5rem 1.8rem; border-radius: 14px;
      border: 1px solid var(--line); background: var(--beige); box-shadow: 0 18px 50px -32px rgba(0, 0, 0, 0.35);
    }
    .dlg-root .line.prosecutor { justify-content: flex-start; flex-direction: row; }
    .dlg-root .line.prosecutor .card { color: var(--terracotta); }
    .dlg-root .line.accused { justify-content: flex-end; flex-direction: row-reverse; }
    .dlg-root .line.accused .card { color: var(--olive); }
    .dlg-root .line .speech { font-weight: 500; font-size: 1.05rem; line-height: 1.68; color: var(--ink); }

    .dlg-root.dark-mode .line .card { background: #1b1714; border-color: #454545; }
    .dlg-root.dark-mode .line .speech { color: #ece5dc !important; }
  </style>
</head>
<body>

  <div id="root"></div>

  <!-- JavaScript App Script скомпилированный на лету Babel -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Данные сцен и диалога
    const DIALOGUE_DATA = [
      { id: 1, role: 'prosecutor', speaker: 'Обвинитель', text: 'Твои дела несовершенны. Закон требует полной праведности, а ты спотыкаешься вновь и вновь!' },
      { id: 2, role: 'accused', speaker: 'Обвиняемый', text: 'Я признаю свою полную немощь. В моем человеческом естестве нет ни единого доброго помышления.' },
      { id: 3, role: 'prosecutor', speaker: 'Обвинитель', text: 'Тогда какое право ты имеешь надеяться на оправдание?' },
      { id: 4, role: 'accused', speaker: 'Обвиняемый', text: 'Моя надежда — не в моих делах, а в Совершенной Праведности Христа, данный мне даром по вере!' }
    ];

    const CAST_DATA = {
      prosecutor: { kicker: "Закон", name: "Обвинитель", role: "Строгий Судья Совести", desc: "Указывает на полную немощь человеческого естества и строгость Божьего стандарта." },
      accused: { kicker: "Благодать", name: "Обвиняемый", role: "Раскаянный Грешник", desc: "Уповает не на собственные силы, а на полную капитуляцию перед Богом и Его Праведность." }
    };

    // Компонент подписи
    function CastCaption({ data, slot, visible }) {
      if (!data) return null;
      return (
        <div className={`cap-slot slot-${slot}`}>
          <article className={`cast-caption ${visible ? "is-in" : ""}`}>
            <div className="cap-head">
              <div className="cap-kicker">{data.kicker}</div>
              <h2 className="cap-name">{data.name}</h2>
              <div className="cap-role">{data.role}</div>
            </div>
            <p className="cap-desc">{data.desc}</p>
          </article>
        </div>
      );
    }

    // Компонент сцены
    function CourtStage({ isStarted, isDarkMode }) {
      return (
        <div className={`stage ${isStarted ? "is-on" : ""}`}>
          <div className="stage-scrim"></div>
        </div>
      );
    }

    // Компонент строки диалога
    function DialogueLine({ line }) {
      return (
        <div className={`line ${line.role}`}>
          <div className="card">
            <div className="role">{line.speaker}</div>
            <div className="speech">{line.text}</div>
          </div>
        </div>
      );
    }

    // Главный экран (Hero)
    function Hero({ onStart, isHidden }) {
      return (
        <div className={`court-hero ${isHidden ? "is-hidden" : ""}`}>
          <div className="eyebrow">Весть Праведности по Вере</div>
          <h1>Голос Истины: <em>Судебный Диалог</em></h1>
          <p className="sub">Открой сердце для понимания созидательной силы Божьей и полной немощи человеческой.</p>
          <button className="entry-btn" onClick={onStart}>
            Начать Судебный Процесс
          </button>
        </div>
      );
    }

    // Основное приложение
    function App() {
      const [isStarted, setIsStarted] = useState(false);
      const [isDarkMode, setIsDarkMode] = useState(false);

      const toggleTheme = () => setIsDarkMode(!isDarkMode);

      return (
        <div className={`dlg-root ${isDarkMode ? "dark-mode" : ""}`}>
          <button className="theme-toggle" onClick={toggleTheme} title="Переключить тему">
            {isDarkMode ? "☀️" : "🌙"}
          </button>

          <Hero onStart={() => setIsStarted(true)} isHidden={isStarted} />
          
          <CourtStage isStarted={isStarted} isDarkMode={isDarkMode} />

          {isStarted && (
            <div className="captions">
              <CastCaption data={CAST_DATA.prosecutor} slot="left" visible={true} />
              <CastCaption data={CAST_DATA.accused} slot="right" visible={true} />
            </div>
          )}

          {isStarted && (
            <main className="court">
              <div className="scene-label">
                <span className="cast-title">Слушание Дела</span>
              </div>
              {DIALOGUE_DATA.map((line) => (
                <DialogueLine key={line.id} line={line} />
              ))}
            </main>
          )}
        </div>
      );
    }

    // Рендеринг в DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
