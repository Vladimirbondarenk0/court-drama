<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99% людей не знают этих фактов о Библии. А ты?</title>
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Стили из твоей системы -->
    <style>
        :root {
            --primary-color: #5943BE;
            --background-gradient: linear-gradient(135deg, #3B2B87 0%, #5943BE 50%, #9136FE 100%);
            --text-font: 'Montserrat', sans-serif;
            --component-border-radius: 6px;
            --button-shadow: 0 5px 20px 0 rgba(89, 67, 190, 0.3);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--background-gradient);
            font-family: var(--text-font);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 24px;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: var(--component-border-radius);
            padding: 32px;
            box-shadow: var(--button-shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        p {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>99% людей не знают этих фактов о Библии. А ты?</h1>
            <p>Жизнь человека полна суеты, но истинный свет пробивается сквозь любую темноту, когда мы обретаем покой в простоте и силе созидающего Слова.</p>
        </div>
    </div>

</body>
</html>
